load_module /opt/otel_ngx_module.so;

events {}

http {
  opentelemetry_config /etc/nginx/otel.toml;
  access_log /dev/stdout;
  error_log stderr info;

  upstream integration-backend {
    server backend:80;
  }

  server {
    listen 8000;
    server_name integration;

    location = /healthz {
      opentelemetry off;
      access_log off;
      return 200 "ok\n";
    }

    # Proxied request: same shape as production (module creates/export spans).
    location / {
      opentelemetry on;
      opentelemetry_operation_name integration_proxy;
      opentelemetry_propagate;
      add_header Trace-Id $opentelemetry_trace_id always;
      proxy_pass http://integration-backend/;
    }
  }
}
