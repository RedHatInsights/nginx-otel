apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: nginx-otel-integration-test
spec:
  description: >
    Integration-test the nginx-otel image from a Konflux SNAPSHOT: load the OTEL
    module, proxy a request, and verify a span is exported to Jaeger (OTLP).
  params:
    - name: SNAPSHOT
      description: Konflux Snapshot JSON (injected by Integration Service)
      type: string
    - name: COMPONENT_NAME
      description: Component name inside the Snapshot
      type: string
      default: nginx-otel
  tasks:
    - name: otel-it
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: COMPONENT_NAME
          value: $(params.COMPONENT_NAME)
      taskSpec:
        params:
          - name: SNAPSHOT
            type: string
          - name: COMPONENT_NAME
            type: string
        results:
          - name: TEST_OUTPUT
            description: Concise integration-test result for Integration Service
        steps:
          - name: run-integration-test
            image: quay.io/konflux-ci/konflux-test:latest
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: COMPONENT_NAME
                value: $(params.COMPONENT_NAME)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              write_result() {
                local result="$1"
                local failures="$2"
                local successes="$3"
                python3 -c "
              import json, pathlib, datetime
              pathlib.Path('$(results.TEST_OUTPUT.path)').write_text(json.dumps({
                'result': '$result',
                'timestamp': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
                'failures': int('$failures'),
                'successes': int('$successes'),
              }) + chr(10))
              print(pathlib.Path('$(results.TEST_OUTPUT.path)').read_text(), end='')
              "
              }

              fail() {
                echo "FAIL: $*" >&2
                write_result FAILURE 1 0
                exit 1
              }
              pass() {
                echo "PASS: $*"
                write_result SUCCESS 0 1
              }

              command -v jq >/dev/null || fail "jq missing in task image"
              command -v kubectl >/dev/null || fail "kubectl missing in task image"
              command -v python3 >/dev/null || fail "python3 missing in task image"

              IMAGE="$(jq -r --arg n "${COMPONENT_NAME}" \
                '.components[] | select(.name == $n) | .containerImage // empty' <<<"${SNAPSHOT}")"
              if [[ -z "${IMAGE}" || "${IMAGE}" == "null" ]]; then
                IMAGE="$(jq -r '.components[0].containerImage // empty' <<<"${SNAPSHOT}")"
              fi
              [[ -n "${IMAGE}" && "${IMAGE}" != "null" ]] || fail "no containerImage in SNAPSHOT"
              echo "Using image: ${IMAGE}"

              SUFFIX="$(echo "s${RANDOM}$(date +%s)" | tr -cd 'a-z0-9' | cut -c1-20)"
              NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              JAEGER="otel-j-${SUFFIX}"
              BACKEND="otel-b-${SUFFIX}"
              NGINX="otel-n-${SUFFIX}"
              CM="otel-c-${SUFFIX}"
              SVC_J="otel-sj-${SUFFIX}"
              SVC_B="otel-sb-${SUFFIX}"
              SVC_N="otel-sn-${SUFFIX}"

              cleanup() {
                set +e
                kubectl -n "${NS}" delete pod,svc,configmap -l "nginx-otel-it=${SUFFIX}" \
                  --wait=false --ignore-not-found >/dev/null 2>&1
              }
              trap cleanup EXIT

              WORK="$(mktemp -d)"

              cat >"${WORK}/nginx.conf" <<EOF
              load_module /opt/otel_ngx_module.so;
              events {}
              http {
                opentelemetry_config /etc/nginx/otel.toml;
                access_log /dev/stdout;
                error_log stderr info;
                upstream integration-backend { server ${SVC_B}:80; }
                server {
                  listen 8000;
                  location = /healthz {
                    opentelemetry off;
                    access_log off;
                    return 200 "ok\\n";
                  }
                  location / {
                    opentelemetry on;
                    opentelemetry_operation_name integration_proxy;
                    opentelemetry_propagate;
                    add_header Trace-Id \$opentelemetry_trace_id always;
                    proxy_pass http://integration-backend/;
                  }
                }
              }
              EOF

              cat >"${WORK}/otel.toml" <<EOF
              exporter = "otlp"
              processor = "simple"
              [exporters.otlp]
              host = "${SVC_J}"
              port = 4317
              [service]
              name = "nginx-otel-it"
              [sampler]
              name = "AlwaysOn"
              parent_based = false
              EOF

              kubectl -n "${NS}" create configmap "${CM}" \
                --from-file=nginx.conf="${WORK}/nginx.conf" \
                --from-file=otel.toml="${WORK}/otel.toml"
              kubectl -n "${NS}" label configmap "${CM}" "nginx-otel-it=${SUFFIX}"

              kubectl -n "${NS}" create service clusterip "${SVC_J}" --tcp=4317:4317 --tcp=16686:16686
              kubectl -n "${NS}" label svc "${SVC_J}" "nginx-otel-it=${SUFFIX}"
              kubectl -n "${NS}" patch svc "${SVC_J}" --type=merge -p "{\"spec\":{\"selector\":{\"app\":\"${JAEGER}\"}}}"

              kubectl -n "${NS}" create service clusterip "${SVC_B}" --tcp=80:80
              kubectl -n "${NS}" label svc "${SVC_B}" "nginx-otel-it=${SUFFIX}"
              kubectl -n "${NS}" patch svc "${SVC_B}" --type=merge -p "{\"spec\":{\"selector\":{\"app\":\"${BACKEND}\"}}}"

              kubectl -n "${NS}" create service clusterip "${SVC_N}" --tcp=8000:8000
              kubectl -n "${NS}" label svc "${SVC_N}" "nginx-otel-it=${SUFFIX}"
              kubectl -n "${NS}" patch svc "${SVC_N}" --type=merge -p "{\"spec\":{\"selector\":{\"app\":\"${NGINX}\"}}}"

              kubectl -n "${NS}" run "${JAEGER}" \
                --image=docker.io/jaegertracing/all-in-one:1.60 \
                --labels="app=${JAEGER},nginx-otel-it=${SUFFIX}" \
                --restart=Never \
                --env=COLLECTOR_OTLP_ENABLED=true \
                --port=4317 --port=16686

              kubectl -n "${NS}" run "${BACKEND}" \
                --image=docker.io/library/httpd:2.4-alpine \
                --labels="app=${BACKEND},nginx-otel-it=${SUFFIX}" \
                --restart=Never

              cat >"${WORK}/nginx-pod.yaml" <<EOF
              apiVersion: v1
              kind: Pod
              metadata:
                name: ${NGINX}
                labels:
                  app: ${NGINX}
                  nginx-otel-it: "${SUFFIX}"
              spec:
                restartPolicy: Never
                containers:
                  - name: nginx
                    image: "${IMAGE}"
                    imagePullPolicy: Always
                    command: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
                    ports:
                      - containerPort: 8000
                    volumeMounts:
                      - name: conf
                        mountPath: /etc/nginx/nginx.conf
                        subPath: nginx.conf
                      - name: conf
                        mountPath: /etc/nginx/otel.toml
                        subPath: otel.toml
                volumes:
                  - name: conf
                    configMap:
                      name: ${CM}
              EOF
              kubectl -n "${NS}" apply -f "${WORK}/nginx-pod.yaml"

              echo "==> Waiting for pods"
              kubectl -n "${NS}" wait --for=condition=Ready "pod/${JAEGER}" --timeout=180s
              kubectl -n "${NS}" wait --for=condition=Ready "pod/${BACKEND}" --timeout=180s
              kubectl -n "${NS}" wait --for=condition=Ready "pod/${NGINX}" --timeout=180s

              curl_svc() {
                local url="$1"; shift
                kubectl -n "${NS}" run "otel-curl-${SUFFIX}-${RANDOM}" --rm -i --restart=Never \
                  --image=docker.io/curlimages/curl:8.5.0 \
                  --labels="nginx-otel-it=${SUFFIX}" \
                  --quiet -- curl "$@" "${url}"
              }

              echo "==> healthz"
              out=""
              for _ in $(seq 1 30); do
                out="$(curl_svc "http://${SVC_N}:8000/healthz" -sf || true)"
                [[ "${out}" == ok* ]] && break
                sleep 2
              done
              [[ "${out}" == ok* ]] || { kubectl -n "${NS}" logs "${NGINX}" || true; fail "healthz: ${out}"; }
              echo "healthz ok"

              echo "==> proxied /"
              headers="$(curl_svc "http://${SVC_N}:8000/" -sD - -o /dev/null || true)"
              echo "${headers}" | head -20
              echo "${headers}" | grep -qiE "Trace-Id:[[:space:]]*[0-9a-fA-F]{16,}" \
                || { kubectl -n "${NS}" logs "${NGINX}" || true; fail "missing Trace-Id header"; }
              TRACE_ID="$(echo "${headers}" | grep -i "^Trace-Id:" | head -1 | sed "s/.*:[[:space:]]*//" | tr -d "\r")"
              TID_LC="$(echo "${TRACE_ID}" | tr "A-F" "a-f")"
              echo "Trace-Id=${TRACE_ID}"

              echo "==> Jaeger"
              found=0
              for _ in $(seq 1 45); do
                services="$(curl_svc "http://${SVC_J}:16686/api/services" -sf || true)"
                if echo "${services}" | grep -q nginx-otel-it; then
                  traces="$(curl_svc "http://${SVC_J}:16686/api/traces?service=nginx-otel-it&limit=10" -sf || true)"
                  if echo "${traces}" | grep -qi "${TID_LC}" || echo "${traces}" | grep -q integration_proxy; then
                    found=1
                    break
                  fi
                fi
                sleep 2
              done
              [[ "${found}" -eq 1 ]] || {
                kubectl -n "${NS}" logs "${NGINX}" || true
                kubectl -n "${NS}" logs "${JAEGER}" --tail=80 || true
                fail "no OTLP trace in Jaeger"
              }

              pass "integration test against ${IMAGE}"
