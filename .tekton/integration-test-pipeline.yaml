apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: nginx-otel-integration-test
spec:
  description: >
    Integration-test the nginx-otel SNAPSHOT image with Tekton sidecars only
    (Jaeger + httpd + nginx on 127.0.0.1). Does not call the Kubernetes /
    OpenShift API — no kubectl/oc.
  params:
    - name: SNAPSHOT
      description: Konflux Snapshot JSON (injected by Integration Service)
      type: string
    - name: COMPONENT_NAME
      description: Component name inside the Snapshot
      type: string
      default: nginx-otel
  results:
    - name: TEST_OUTPUT
      description: Concise integration-test result for Integration Service
      value: $(tasks.otel-it.results.TEST_OUTPUT)
  tasks:
    - name: extract-image
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: COMPONENT_NAME
          value: $(params.COMPONENT_NAME)
      taskSpec:
        params:
          - name: SNAPSHOT
            type: string
          - name: COMPONENT_NAME
            type: string
        results:
          - name: IMAGE
            description: containerImage from the Snapshot
        steps:
          - name: extract
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: COMPONENT_NAME
                value: $(params.COMPONENT_NAME)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              if ! command -v jq >/dev/null; then
                # ubi-minimal already has curl-minimal; only install jq.
                if command -v microdnf >/dev/null; then microdnf -y install jq >/dev/null
                elif command -v dnf >/dev/null; then dnf -y install jq >/dev/null
                else echo "jq missing" >&2; exit 1; fi
              fi
              IMAGE="$(jq -r --arg n "${COMPONENT_NAME}" \
                '.components[] | select(.name == $n) | .containerImage // empty' <<<"${SNAPSHOT}")"
              if [[ -z "${IMAGE}" || "${IMAGE}" == "null" ]]; then
                IMAGE="$(jq -r '.components[0].containerImage // empty' <<<"${SNAPSHOT}")"
              fi
              [[ -n "${IMAGE}" && "${IMAGE}" != "null" ]] || { echo "no containerImage in SNAPSHOT" >&2; exit 1; }
              echo "Using image: ${IMAGE}"
              printf '%s' "${IMAGE}" > "$(results.IMAGE.path)"

    - name: otel-it
      runAfter:
        - extract-image
      taskSpec:
        results:
          - name: TEST_OUTPUT
            description: Concise integration-test result for Integration Service
        sidecars:
          - name: jaeger
            image: docker.io/jaegertracing/all-in-one:1.60
            env:
              - name: COLLECTOR_OTLP_ENABLED
                value: "true"
          - name: backend
            image: docker.io/library/httpd:2.4-alpine
          - name: nginx
            image: $(tasks.extract-image.results.IMAGE)
            imagePullPolicy: Always
            env:
              - name: OTEL_B64
                value: "ZXhwb3J0ZXIgPSAib3RscCIKcHJvY2Vzc29yID0gInNpbXBsZSIKW2V4cG9ydGVycy5vdGxwXQpob3N0ID0gIjEyNy4wLjAuMSIKcG9ydCA9IDQzMTcKW3NlcnZpY2VdCm5hbWUgPSAibmdpbngtb3RlbC1pdCIKW3NhbXBsZXJdCm5hbWUgPSAiQWx3YXlzT24iCnBhcmVudF9iYXNlZCA9IGZhbHNlCg=="
              - name: NGINX_B64
                value: ""
            command: ["/bin/sh", "-c"]
            args:
              # Tekton sidecars often use a minimal PATH without /usr/sbin.
              - >-
                printf '%s' "$OTEL_B64" | base64 -d > /tmp/otel.toml
                && printf '%s' "$NGINX_B64" | base64 -d > /tmp/nginx.conf
                && exec /usr/sbin/nginx -c /tmp/nginx.conf -g 'daemon off;'
        steps:
          - name: run-integration-test
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              write_result() {
                local result="$1"
                local failures="$2"
                local successes="$3"
                jq -n \
                  --arg result "${result}" \
                  --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  --argjson failures "${failures}" \
                  --argjson successes "${successes}" \
                  '{result: $result, timestamp: $ts, failures: $failures, successes: $successes}' \
                  | tee "$(results.TEST_OUTPUT.path)"
              }

              fail() {
                echo "FAIL: $*" >&2
                write_result FAILURE 1 0
                exit 1
              }
              pass() {
                echo "PASS: $*"
                write_result SUCCESS 0 1
              }

              # ubi-minimal ships curl-minimal (/usr/bin/curl). Do NOT install
              # the curl RPM — it conflicts with curl-minimal.
              command -v curl >/dev/null || fail "curl missing (expected curl-minimal on ubi-minimal)"
              if ! command -v jq >/dev/null; then
                if command -v microdnf >/dev/null; then
                  microdnf -y install jq >/dev/null
                elif command -v dnf >/dev/null; then
                  dnf -y install jq >/dev/null
                else
                  fail "jq missing and no package manager"
                fi
              fi
              echo "Testing SNAPSHOT image via Tekton sidecars (localhost; no cluster API)"

              echo "==> healthz"
              out=""
              for _ in $(seq 1 60); do
                out="$(curl -sf "http://127.0.0.1:8000/healthz" 2>/dev/null || true)"
                [[ "${out}" == ok* ]] && break
                sleep 2
              done
              [[ "${out}" == ok* ]] || fail "healthz: ${out}"
              echo "healthz ok"

              echo "==> proxied /"
              headers="$(curl -sD - -o /dev/null "http://127.0.0.1:8000/" || true)"
              echo "${headers}" | head -20
              echo "${headers}" | grep -qiE "Trace-Id:[[:space:]]*[0-9a-fA-F]{16,}" \
                || fail "missing Trace-Id header"
              TRACE_ID="$(echo "${headers}" | grep -i "^Trace-Id:" | head -1 | sed "s/.*:[[:space:]]*//" | tr -d "\r")"
              TID_LC="$(echo "${TRACE_ID}" | tr "A-F" "a-f")"
              echo "Trace-Id=${TRACE_ID}"

              echo "==> Jaeger"
              found=0
              for _ in $(seq 1 45); do
                services="$(curl -sf "http://127.0.0.1:16686/api/services" 2>/dev/null || true)"
                if echo "${services}" | grep -q nginx-otel-it; then
                  traces="$(curl -sf "http://127.0.0.1:16686/api/traces?service=nginx-otel-it&limit=10" 2>/dev/null || true)"
                  if echo "${traces}" | grep -qi "${TID_LC}" || echo "${traces}" | grep -q integration_proxy; then
                    found=1
                    break
                  fi
                fi
                sleep 2
              done
              [[ "${found}" -eq 1 ]] || fail "no OTLP trace in Jaeger"

              pass "integration test (sidecar localhost)"
