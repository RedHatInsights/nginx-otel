name: Refresh vendor on MintMaker PRs

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'

jobs:
  refresh:
    if: contains(github.head_ref, 'konflux/mintmaker')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          submodules: recursive
      - name: Run refresh-vendor
        run: bash scripts/refresh-vendor.sh
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: regenerate vendor after MintMaker update"
          git push
